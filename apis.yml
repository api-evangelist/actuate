name: Actuate
description: >-
  Actuate Corporation was an enterprise business intelligence and reporting
  software company founded in 1993 and backed by Accel (partner Arthur
  Patterson). It was the original developer of BIRT (Business Intelligence and
  Reporting Tools), building a developer community measured in millions of
  downloads, and traded on NASDAQ under the ticker BIRT. OpenText acquired
  Actuate in January 2015 and folded its analytics and reporting technology into
  OpenText Analytics Cloud. The standalone actuate.com site is no longer an
  active product presence (all paths return HTTP 404) and the company publishes
  no independent, live API or developer portal today. A separately named company
  at actuate.ai (AI video/threat detection) is unrelated to this Accel-portfolio
  entity and likewise exposes no public API.
